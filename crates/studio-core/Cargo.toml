[package]
name = "studio-core"
description = "Pikara Science Studio engine (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
studio-platform = { path = "../studio-platform" }
pinyin = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"

# Windows-only: DXGI / D3D12 / CUDA adapter detection, GPU performance counters.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_System_Performance", "Win32_System_LibraryLoader"] }
