name: Linux headless E2E

# A complete short video made with the command line only, on a Linux server without any desktop, display, X11,
# Wayland or GPU: script → voice (CosyVoice 3 on CPU, fp32) → subtitles → mix → render (headless Chromium) →
# QA → MP4, including an interrupted-and-resumed worker. The MP4, frames and report are uploaded for review.
#
# CI result, not a real-hardware result: GitHub's runner is a 4-core VM with no GPU. The test voice is CosyVoice's
# own Apache-2.0 sample prompt, not the channel's narrator.

on:
  workflow_dispatch:
  push:
    branches: ["feat/cross-platform"]
    paths: ["crates/**", "pipeline/**", "scripts/**", ".github/workflows/linux-headless-e2e.yml"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: CLI-only production (ubuntu-24.04, no display, CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Work folder (outside the checkout)
        run: echo "W=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System tools (no desktop packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg sox libsox-dev
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          echo "DISPLAY=${DISPLAY:-<unset>} WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-<unset>}"
          dpkg -l | grep -Ei 'xserver-xorg-core|gnome-shell|kde-plasma|weston' || echo "no display server packages"
      - name: Build CLI
        working-directory: crates
        run: cargo build --release -p studio-cli
      - name: Free disk space for models
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Create the project (CLI)
        run: |
          mkdir -p "$W"
          env -u DISPLAY crates/target/release/pikara-studio --data "$W/data" --json project new --dest "$W/project" --title "E2E" --template pipeline --no-link-tools
      - name: Cache CosyVoice models
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.W }}/project/tools/CosyVoice/pretrained_models
          key: cosyvoice3-0.5b-2512-whisper-turbo-v1
      - name: Install CosyVoice 3 (CPU) — scripts/install-cosyvoice.sh
        run: PYTHON=python3.10 bash scripts/install-cosyvoice.sh "$W/project" cpu
      - name: Produce the video (scripts/e2e-headless.sh)
        run: env -u DISPLAY bash scripts/e2e-headless.sh crates/target/release/pikara-studio "$W"
      - name: Summary
        if: always()
        run: |
          cat "$W/report.json" 2>/dev/null || true
          tail -50 "$W/logs/worker.txt" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-headless-e2e
          path: |
            ${{ env.W }}/output.mp4
            ${{ env.W }}/report.json
            ${{ env.W }}/frames/
            ${{ env.W }}/logs/
          if-no-files-found: ignore
