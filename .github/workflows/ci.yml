name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

jobs:
  studio-windows:
    name: Studio (Windows) — test & build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/app/src-tauri -> target

      - name: Install frontend/CLI dependencies
        working-directory: studio/app
        run: npm ci

      - name: UI routes check (new pages wired in, old page not shipped)
        working-directory: studio/app
        run: node scripts/check-ui.mjs

      - name: Rust unit tests
        working-directory: studio/app/src-tauri
        run: cargo test --release

      - name: Build exe + NSIS installer
        working-directory: studio/app
        run: npx tauri build

      - name: Built exe embeds this source's frontend
        working-directory: studio/app
        run: node scripts/check-ui.mjs --exe src-tauri/target/release/PikaraScienceStudio.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PikaraScienceStudio-windows
          path: |
            studio/app/src-tauri/target/release/PikaraScienceStudio.exe
            studio/app/src-tauri/target/release/bundle/nsis/*.exe

  pipeline-typecheck:
    name: Pipeline template — TypeScript check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - name: Install
        working-directory: pipeline
        run: npm ci --ignore-scripts
      - name: tsc
        working-directory: pipeline
        run: npx tsc --noEmit
