name: Cross-platform

# Real tests on every target OS. Nothing here signs, notarizes or publishes; no secrets are used, so the job is safe
# to run on any branch. Release builds (signed update packages) are a separate workflow that checks its secrets
# first and never passes empty Apple certificate variables to tauri.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: xp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-24.04 }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/app/src-tauri -> target
          key: ${{ matrix.name }}
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Rust unit tests
        working-directory: studio/app/src-tauri
        run: cargo test --no-fail-fast
      - name: Hardware detection (read-only CLI, isolated data dir)
        shell: bash
        working-directory: studio/app/src-tauri
        run: |
          cargo build
          export PIKARA_STUDIO_DATA="$RUNNER_TEMP/pss-data"
          ./target/debug/PikaraScienceStudio --cli hardware | tee "$RUNNER_TEMP/hardware-${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-${{ matrix.name }}
          path: ${{ runner.temp }}/hardware-${{ matrix.name }}.json
          if-no-files-found: ignore

  media:
    # Real encodes (not encoder lists), real WebGL frame in Chromium, real tensor ops on the accelerator.
    name: Media + AI probes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -hide_banner -encoders | grep -Ei 'videotoolbox|nvenc|vaapi|libx26' || true
      - name: Encoder real-encode test (hwenc.mjs)
        working-directory: pipeline
        shell: bash
        run: |
          mkdir -p out
          node -e "import('./scripts/hwenc.mjs').then(async m => { const r = await m.probe({codec:'h264', all:true, force:true}); console.log(JSON.stringify(r,null,2)); })" | tee out/hwenc-h264.json
          node -e "import('./scripts/hwenc.mjs').then(async m => { const r = await m.probe({codec:'hevc', all:true, force:true}); console.log(JSON.stringify(r,null,2)); })" | tee out/hwenc-hevc.json
      - name: Pipeline dependencies
        working-directory: pipeline
        run: npm ci
      - name: Chromium WebGL / Three.js probe (gpu-check.mjs, real frame)
        working-directory: pipeline
        continue-on-error: true
        run: node scripts/gpu-check.mjs --force
      - name: Short real render (render.mjs, 90 frames, measured encoder)
        working-directory: pipeline
        continue-on-error: true
        run: node scripts/render.mjs gpu --comp EP01-30fps --frames 0-89 --skip-check --allow-cpu-fallback --out out/ci-render.mp4
      - name: AI accelerator probe (torch CPU/MPS, MLX)
        shell: bash
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy torch
          if [ "$RUNNER_OS" = macOS ] && [ "$(uname -m)" = arm64 ]; then python -m pip install --quiet mlx; fi
          python -I pipeline/scripts/accel_probe.py --size 1024 --out pipeline/out/accel-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-${{ matrix.name }}
          path: |
            pipeline/out/*.json
            pipeline/out/ci-render.mp4
            pipeline/out/render-report*.json
            pipeline/out/probe-*.log
          if-no-files-found: ignore

  macos-bundle:
    # Unsigned, NOT notarized developer build: proves a native .app/.dmg is produced and contains no Windows
    # binaries. Apple notarization needs an Apple Developer certificate (not configured); Pikara update signing is a
    # separate trust chain (minisign) handled by the release workflow.
    name: macOS bundle (${{ matrix.name }}, not notarized)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64, os: macos-15 }
          - { name: x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/app/src-tauri -> target
          key: bundle-${{ matrix.name }}
      - name: Install Tauri CLI
        working-directory: studio/app
        run: npm ci
      - name: Build .app + .dmg (unsigned)
        working-directory: studio/app
        shell: bash
        run: |
          # never pass empty Apple certificate variables (tauri would try to sign with them)
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do unset $v; done
          npx tauri build --bundles app,dmg
      - name: Verify bundle contents
        shell: bash
        run: |
          B=studio/app/src-tauri/target/release/bundle
          APP=$(ls -d $B/macos/*.app | head -1)
          file "$APP/Contents/MacOS/"*
          lipo -archs "$APP/Contents/MacOS/PikaraScienceStudio"
          if find "$APP" -iname '*.exe' -o -iname '*.dll' | grep .; then echo "Windows binaries inside the macOS bundle" && exit 1; fi
          ls -la $B/dmg/
          DMG=$(ls $B/dmg/*.dmg | head -1)
          test $(stat -f%z "$DMG") -gt 2000000
          # the bundled app must start headless and answer the read-only hardware CLI
          PIKARA_STUDIO_DATA="$RUNNER_TEMP/pss-data" "$APP/Contents/MacOS/PikaraScienceStudio" --cli hardware > "$RUNNER_TEMP/bundle-hw.json"
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/bundle-hw.json'));print(d['platform'], d['machine']['profile']['appleSilicon'], [g['name'] for g in d['snapshot']['gpus']])"
          shasum -a 256 "$DMG" | tee $B/dmg/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PikaraScienceStudio-macos-${{ matrix.name }}-NOT-NOTARIZED
          path: |
            studio/app/src-tauri/target/release/bundle/dmg/*.dmg
            studio/app/src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
