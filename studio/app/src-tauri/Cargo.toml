[package]
name = "pikara-science-studio"
version = "0.2.0"
description = "Pikara Science Studio"
authors = ["Pikara Science contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "PikaraScienceStudio"
path = "src/main.rs"

[lib]
name = "studio_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
pinyin = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
